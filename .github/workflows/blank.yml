name: Build WebRTC (Debug)

env:
  XCODE_VERSION: 26.5

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  Build-Script:
    runs-on: macos-26
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_DEBUG: "1"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone Repository
        run: git clone https://github.com/vitali-kurlovich/webrtc.git
          
        
      - name: Build WebRCT
        run: |
          mv webrtc/scripts $(pwd)
          mv webrtc/templates $(pwd)
          mv webrtc/requirements.txt $(pwd)
          mv webrtc/.gitignore $(pwd)
          mv webrtc/.swift-version $(pwd)
          
          pip install --upgrade -r requirements.txt
          sh scripts/clean.sh
          sh scripts/release.sh
